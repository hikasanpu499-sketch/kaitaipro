// ── FlowBar ──────────────────────────────────────────────
function FlowBar({current,onChange}){
  const flowMap={"見積":"見積中","受注":"受注済","請求":"請求済","入金":"入金済","完了":"完了"};
  const currentIdx=FLOW_STEPS.findIndex(s=>flowMap[s]===current);
  return (
    <div style={{display:"flex",alignItems:"center",gap:4,flexWrap:"wrap"}}>
      {FLOW_STEPS.map((step,i)=>{
        const status=flowMap[step];
        const isActive=current===status;
        const isDone=i<currentIdx;
        return (
          <button key={step} onClick={()=>onChange(status)}
            style={{background:isActive?AC:isDone?"#fef3ee":"#f9fafb",color:isActive?"#fff":isDone?AC:"#9ca3af",border:`1.5px solid ${isActive?AC:isDone?"#f8c4a8":"#e5e7eb"}`,padding:"5px 12px",fontSize:11,fontWeight:700,cursor:"pointer",borderRadius:20,transition:"all .15s"}}>
            {isDone?"✓ ":""}{step}
          </button>
        );
      })}
    </div>
  );
}

// ── InvitePanel ──────────────────────────────────────────
function InvitePanel({user,companyId}){
  const [role,setRole]=useState("staff");
  const [loading,setLoading]=useState(false);
  const [msg,setMsg]=useState("");
  const [members,setMembers]=useState([]);
  const [codes,setCodes]=useState([]);
  const [showCodeForm,setShowCodeForm]=useState(false);
  useEffect(()=>{loadMembers();loadCodes();},[]);
  async function loadMembers(){const{data}=await sb.from("members").select("*").eq("company_id",companyId).order("id",{ascending:true});if(data)setMembers(data);}
  async function loadCodes(){const{data}=await sb.from("invite_codes").select("*").eq("company_id",companyId).order("id",{ascending:false});if(data)setCodes(data);}
  function generateCode(r){const p=r==="admin"?"ADMIN":"STAFF";const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<6;i++)s+=c[Math.floor(Math.random()*c.length)];return`${p}-${s}`;}
  async function createCode(){
    setLoading(true);setMsg("");
    const code=generateCode(role);
    const{error}=await sb.from("invite_codes").insert({code,role,used:false,created_by:user.email,company_id:companyId});
    if(error){setMsg(`❌ 失敗: ${error.message}`);}
    else{setMsg(`✅ 招待コードを発行しました！\n\n🔑 コード：${code}\n👤 権限：${role==="admin"?"管理者":"スタッフ"}\n\nURL：${window.location.origin}\nコード：${code}`);setShowCodeForm(false);loadCodes();}
    setLoading(false);
  }
  async function deleteCode(id){await sb.from("invite_codes").delete().eq("id",id);loadCodes();}
  async function changeRole(id,newRole){await sb.from("members").update({role:newRole}).eq("id",id);loadMembers();}
  async function removeMember(id,email){if(!confirm(`${email}を削除しますか？`))return;await sb.from("members").delete().eq("id",id);loadMembers();}
  const rc=r=>r==="admin"?"#c84b00":"#3b82f6";
  return (
    <div>
      {msg&&<div style={{fontSize:12,padding:"12px 14px",background:msg.includes("✅")?"#f0fdf4":"#fef2f2",border:`1px solid ${msg.includes("✅")?"#bbf7d0":"#fecaca"}`,borderRadius:8,marginBottom:14,color:msg.includes("✅")?"#16a34a":"#ef4444",lineHeight:1.8,whiteSpace:"pre-line"}}>{msg}</div>}
      <div style={{marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
          <div style={{fontSize:12,color:"#6b7280",fontWeight:700}}>招待コード</div>
          <button className="bp" style={{fontSize:12,padding:"6px 12px"}} onClick={()=>setShowCodeForm(!showCodeForm)}>{showCodeForm?"✕ 閉じる":"🔑 コードを発行"}</button>
        </div>
        {showCodeForm&&(
          <div style={{background:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:8,padding:16,marginBottom:12}}>
            <label className="lbl">権限</label>
            <div style={{display:"flex",gap:8,marginBottom:14}}>
              {[{v:"staff",l:"👤 スタッフ"},{v:"admin",l:"👑 管理者"}].map(r=>(
                <button key={r.v} onClick={()=>setRole(r.v)} style={{flex:1,background:role===r.v?AC:"#fff",color:role===r.v?"#fff":"#374151",border:`1.5px solid ${role===r.v?AC:"#d1d5db"}`,padding:"8px",borderRadius:6,fontSize:13,fontWeight:700,cursor:"pointer"}}>{r.l}</button>
              ))}
            </div>
            <button className="bp" style={{width:"100%"}} onClick={createCode} disabled={loading}>{loading?"発行中...":"コードを発行する"}</button>
          </div>
        )}
        {codes.length>0&&(
          <div>
            <div style={{fontSize:11,color:"#9ca3af",marginBottom:8}}>発行済みの招待コード</div>
            {codes.map(c=>(
              <div key={c.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",background:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:6,marginBottom:6}}>
                <span style={{fontFamily:"monospace",fontSize:14,fontWeight:900,color:"#111",letterSpacing:"0.1em",flex:1}}>{c.code}</span>
                <span style={{background:`${rc(c.role)}15`,color:rc(c.role),border:`1px solid ${rc(c.role)}33`,padding:"2px 8px",borderRadius:20,fontSize:10,fontWeight:700}}>{c.role==="admin"?"管理者":"スタッフ"}</span>
                <button onClick={()=>deleteCode(c.id)} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:14}}>×</button>
              </div>
            ))}
          </div>
        )}
      </div>
      <div style={{borderTop:"1px solid #f3f4f6",paddingTop:14}}>
        <div style={{fontSize:12,color:"#6b7280",fontWeight:700,marginBottom:12}}>メンバー一覧 ({members.length}人)</div>
        {members.length===0?<div style={{textAlign:"center",padding:"16px",color:"#9ca3af",fontSize:13}}>まだメンバーがいません</div>:members.map(m=>(
          <div key={m.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderBottom:"1px solid #f3f4f6"}}>
            <div style={{width:32,height:32,borderRadius:"50%",background:`${rc(m.role)}15`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,flexShrink:0}}>{m.role==="admin"?"👑":"👤"}</div>
            <div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:600,color:"#111",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{m.email}</div></div>
            <select value={m.role} onChange={e=>changeRole(m.id,e.target.value)} style={{background:`${rc(m.role)}10`,color:rc(m.role),border:`1px solid ${rc(m.role)}33`,padding:"4px 8px",borderRadius:20,fontSize:11,fontWeight:700,cursor:"pointer",outline:"none"}}>
              <option value="staff">スタッフ</option><option value="admin">管理者</option>
            </select>
            <button onClick={()=>removeMember(m.id,m.email)} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:16,padding:"0 4px"}}>×</button>
          </div>
        ))}
      </div>
    </div>
  );
}

  async function handleLogin(){
    setLoading(true);setErr("");
    const{error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error)setErr("メールアドレスまたはパスワードが違います");
    setLoading(false);
  }

  async function handleAdminSignup(){
    setLoading(true);setErr("");
    if(!companyName){setErr("会社名を入力してください");setLoading(false);return;}
    const{data,error}=await sb.auth.signUp({email,password:pass});
    if(error){setErr(error.message);setLoading(false);return;}
    // 会社を作成
    const{error:companyErr}=await sb.from("companies").insert({name:companyName,owner_email:email});
    if(companyErr){setErr(`会社登録エラー: ${companyErr.message}`);setLoading(false);return;}
    setErr("✅ 登録完了！ログインしてください。");
    setLoading(false);
  }

  async function handleInviteSignup(){
    setLoading(true);setErr("");
    if(!code){setErr("招待コードを入力してください");setLoading(false);return;}
    const{data:codeData,error:codeErr}=await sb.from("invite_codes").select("*").eq("code",code.toUpperCase()).single();
    if(codeErr||!codeData){setErr("招待コードが無効です");setLoading(false);return;}
    const{error:signupErr}=await sb.auth.signUp({email,password:pass});
    if(signupErr){setErr(signupErr.message);setLoading(false);return;}
    await sb.from("members").insert({email,role:codeData.role,invited_by:codeData.created_by,company_id:codeData.company_id});
    setErr("✅ 登録完了！ログインしてください。");
    setLoading(false);
  }

  return (
    <div style={{minHeight:"100vh",background:"#f3f4f6",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{width:"100%",maxWidth:380}}>
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:48,color:AC,letterSpacing:"0.1em"}}>KAITAI PRO</div>
          <div style={{fontSize:13,color:"#6b7280",marginTop:4}}>解体業専用 請求・見積管理</div>
        </div>
        {mode==="login"&&(
          <div className="card" style={{padding:28}}>
            <div style={{fontWeight:700,fontSize:16,marginBottom:20}}>ログイン</div>
            <div style={{marginBottom:12}}><label className="lbl">メールアドレス</label><input className="ifield" type="email" placeholder="example@email.com" value={email} onChange={e=>setEmail(e.target.value)}/></div>
            <div style={{marginBottom:20}}><label className="lbl">パスワード</label><input className="ifield" type="password" placeholder="6文字以上" value={pass} onChange={e=>setPass(e.target.value)}/></div>
            {err&&<div style={{fontSize:12,color:"#ef4444",marginBottom:14,padding:"8px 12px",background:"#fef2f2",borderRadius:6}}>{err}</div>}
            <button className="bp" style={{width:"100%",fontSize:15,padding:"13px"}} onClick={handleLogin} disabled={loading}>{loading?"処理中...":"ログイン"}</button>
            <div style={{marginTop:20,display:"flex",flexDirection:"column",gap:10}}>
              <button onClick={()=>{setMode("signup_invite");setErr("");}} style={{background:"#f0fdf4",border:"1px solid #bbf7d0",color:"#16a34a",padding:"10px",borderRadius:6,fontSize:13,fontWeight:700,cursor:"pointer"}}>📨 招待コードで新規登録</button>
              <button onClick={()=>{setMode("signup_admin");setErr("");}} style={{background:"#f9fafb",border:"1px solid #e5e7eb",color:"#6b7280",padding:"10px",borderRadius:6,fontSize:12,cursor:"pointer"}}>管理者として新規登録</button>
            </div>
          </div>
        )}
        {mode==="signup_invite"&&(
          <div className="card" style={{padding:28}}>
            <div style={{fontWeight:700,fontSize:16,marginBottom:6}}>招待コードで登録</div>
            <div style={{fontSize:12,color:"#6b7280",marginBottom:20}}>管理者から受け取ったコードを入力してください</div>
            <div style={{marginBottom:12}}><label className="lbl">招待コード</label><input className="ifield" placeholder="例: STAFF-X7K2AB" value={code} onChange={e=>setCode(e.target.value)} style={{textTransform:"uppercase",letterSpacing:"0.1em",fontWeight:700}}/></div>
            <div style={{marginBottom:12}}><label className="lbl">メールアドレス</label><input className="ifield" type="email" placeholder="example@email.com" value={email} onChange={e=>setEmail(e.target.value)}/></div>
            <div style={{marginBottom:20}}><label className="lbl">パスワード（6文字以上）</label><input className="ifield" type="password" placeholder="6文字以上" value={pass} onChange={e=>setPass(e.target.value)}/></div>
            {err&&<div style={{fontSize:12,color:err.includes("✅")?"#16a34a":"#ef4444",marginBottom:14,padding:"8px 12px",background:err.includes("✅")?"#f0fdf4":"#fef2f2",borderRadius:6}}>{err}</div>}
            <button className="bp" style={{width:"100%",fontSize:15,padding:"13px",background:"#16a34a"}} onClick={handleInviteSignup} disabled={loading}>{loading?"処理中...":"登録する"}</button>
            <div style={{textAlign:"center",marginTop:14}}><button onClick={()=>{setMode("login");setErr("");}} style={{background:"none",border:"none",color:"#9ca3af",fontSize:12,cursor:"pointer"}}>← ログインに戻る</button></div>
          </div>
        )}
        {mode==="signup_admin"&&(
          <div className="card" style={{padding:28}}>
            <div style={{fontWeight:700,fontSize:16,marginBottom:6}}>管理者として登録</div>
            <div style={{fontSize:12,color:"#6b7280",marginBottom:16}}>会社の管理者アカウントを作成します</div>
            <div style={{marginBottom:12}}><label className="lbl">会社名 *</label><input className="ifield" placeholder="株式会社〇〇解体" value={companyName} onChange={e=>setCompanyName(e.target.value)}/></div>
            <div style={{marginBottom:12}}><label className="lbl">電話番号</label><input className="ifield" placeholder="03-0000-0000" value={companyTel} onChange={e=>setCompanyTel(e.target.value)}/></div>
            <div style={{marginBottom:12}}><label className="lbl">住所</label><input className="ifield" placeholder="東京都〇〇区..." value={companyAddress} onChange={e=>setCompanyAddress(e.target.value)}/></div>
            <div style={{borderTop:"1px solid #f3f4f6",paddingTop:14,marginBottom:12}}><label className="lbl">メールアドレス</label><input className="ifield" type="email" placeholder="example@email.com" value={email} onChange={e=>setEmail(e.target.value)}/></div>
            <div style={{marginBottom:20}}><label className="lbl">パスワード（6文字以上）</label><input className="ifield" type="password" placeholder="6文字以上" value={pass} onChange={e=>setPass(e.target.value)}/></div>
            {err&&<div style={{fontSize:12,color:err.includes("✅")?"#16a34a":"#ef4444",marginBottom:14,padding:"8px 12px",background:err.includes("✅")?"#f0fdf4":"#fef2f2",borderRadius:6}}>{err}</div>}
            <button className="bp" style={{width:"100%",fontSize:15,padding:"13px"}} onClick={handleAdminSignup} disabled={loading}>{loading?"処理中...":"管理者登録する"}</button>
            <div style={{textAlign:"center",marginTop:14}}><button onClick={()=>{setMode("login");setErr("");}} style={{background:"none",border:"none",color:"#9ca3af",fontSize:12,cursor:"pointer"}}>← ログインに戻る</button></div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── SetupScreen ──────────────────────────────────────────
function SetupScreen({co,setCo,onComplete}){
  const[loading,setLoading]=useState(false);
  async function handleSave(){
    if(!co.name)return alert("会社名を入力してください");
    setLoading(true);
    const settings={name:co.name,zipcode:co.zipcode,address:co.address,tel:co.tel,invoice_no:co.invoiceNo,bank_name:co.bankName,bank_branch:co.bankBranch,bank_type:co.bankType,bank_no:co.bankNo,bank_holder:co.bankHolder,tax_rate:10};
    const{data:existing}=await sb.from("company_settings").select("id").limit(1).single();
    if(existing)await sb.from("company_settings").update(settings).eq("id",existing.id);
    else await sb.from("company_settings").insert(settings);
    setLoading(false);
    onComplete();
  }
  return (
    <div style={{minHeight:"100vh",background:"#f3f4f6",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{width:"100%",maxWidth:420}}>
        <div style={{textAlign:"center",marginBottom:24}}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:40,color:AC,letterSpacing:"0.1em"}}>KAITAI PRO</div>
          <div style={{fontSize:15,fontWeight:700,color:"#111",marginTop:8}}>🎉 登録完了！</div>
          <div style={{fontSize:13,color:"#6b7280",marginTop:6}}>まず会社情報を設定してください</div>
        </div>
        <div className="card" style={{padding:24,marginBottom:14}}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:16,paddingBottom:10,borderBottom:"1px solid #f3f4f6"}}>🏢 会社情報</div>
          {[{k:"name",l:"会社名 *",ph:"株式会社〇〇解体"},{k:"zipcode",l:"郵便番号",ph:"100-0001"},{k:"address",l:"住所",ph:"東京都〇〇区..."},{k:"tel",l:"電話番号",ph:"03-0000-0000"}].map(f=>(
            <div key={f.k} style={{marginBottom:12}}><label className="lbl">{f.l}</label><input className="ifield" placeholder={f.ph} value={co[f.k]} onChange={e=>setCo(p=>({...p,[f.k]:e.target.value}))}/></div>
          ))}
        </div>
        <div className="card" style={{padding:24,marginBottom:14}}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:16,paddingBottom:10,borderBottom:"1px solid #f3f4f6"}}>🧾 インボイス登録番号</div>
          <input className="ifield" placeholder="T1234567890123（T+13桁）" value={co.invoiceNo} onChange={e=>setCo(p=>({...p,invoiceNo:e.target.value}))}/>
          <div style={{fontSize:11,color:"#9ca3af",marginTop:6}}>未登録の場合は空欄でも進めます</div>
        </div>
        <div className="card" style={{padding:24,marginBottom:20}}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:16,paddingBottom:10,borderBottom:"1px solid #f3f4f6"}}>🏦 振込先口座</div>
          {[{k:"bankName",l:"銀行名",ph:"〇〇銀行"},{k:"bankBranch",l:"支店名",ph:"〇〇支店"},{k:"bankType",l:"口座種別",ph:"普通"},{k:"bankNo",l:"口座番号",ph:"1234567"},{k:"bankHolder",l:"口座名義（カナ）",ph:"カ）〇〇カイタイ"}].map(f=>(
            <div key={f.k} style={{marginBottom:12}}><label className="lbl">{f.l}</label><input className="ifield" placeholder={f.ph} value={co[f.k]} onChange={e=>setCo(p=>({...p,[f.k]:e.target.value}))}/></div>
          ))}
        </div>
        <button className="bp" style={{width:"100%",fontSize:15,padding:"14px"}} onClick={handleSave} disabled={loading}>{loading?"保存中...":"設定を保存してはじめる →"}</button>
        <div style={{textAlign:"center",marginTop:12}}><button onClick={onComplete} style={{background:"none",border:"none",color:"#9ca3af",fontSize:12,cursor:"pointer"}}>後で設定する</button></div>
      </div>
    </div>
  );
}

// ── App ──────────────────────────────────────────────────
function App(){
  const[user,setUser]=useState(null);
  const[authLoading,setAuthLoading]=useState(true);
  const[companyId,setCompanyId]=useState(null);
  const[role,setRole]=useState("staff");
  const[docs,setDocs]=useState([]);
  const[tab,setTab]=useState("home");
  const[sub,setSub]=useState(null);
  const[selected,setSelected]=useState(null);
  const[form,setForm]=useState(null);
  const[co,setCo]=useState(EMPTY_CO);
  const[taxRate,setTaxRate]=useState(10);
  const[filter,setFilter]=useState("ALL");
  const[showPrint,setShowPrint]=useState(false);
  const[printTarget,setPrintTarget]=useState(null);
  const[dbLoading,setDbLoading]=useState(false);
  const[setupDone,setSetupDone]=useState(false);

  const TAX=taxRate/100;
  const isAdmin=role==="admin";

  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{setUser(session?.user||null);setAuthLoading(false);});
    const{data:{subscription}}=sb.auth.onAuthStateChange((_,session)=>{setUser(session?.user||null);});
    return()=>subscription.unsubscribe();
  },[]);

  useEffect(()=>{if(user){loadCompany();loadSettings();}},[user]);
  useEffect(()=>{if(companyId){loadDocs();}},[companyId]);

  async function loadCompany(){
    // まずmembersテーブルで会社IDを確認
    const{data:member}=await sb.from("members").select("company_id,role").eq("email",user.email).single();
    if(member&&member.company_id){
      setCompanyId(member.company_id);
      setRole(member.role);
    }else{
      // membersにない場合はcompaniesテーブルで確認（管理者）
      const{data:company}=await sb.from("companies").select("id").eq("owner_email",user.email).single();
      if(company){
        setCompanyId(company.id);
        setRole("admin");
      }else{
        // 新規管理者（まだ会社が作られていない場合）
        setRole("admin");
      }
    }
  }

  async function loadDocs(){
    setDbLoading(true);
    const{data,error}=await sb.from("documents").select("*").eq("company_id",companyId).order("created_at",{ascending:false});
    if(!error&&data)setDocs(data.map(d=>({...d,...(typeof d.data==="string"?JSON.parse(d.data):d.data)})));
    setDbLoading(false);
  }

  async function loadSettings(){
    // company_idがあればそれで絞り込み、なければ最初の1件を取得
    let query=sb.from("company_settings").select("*").limit(1);
    if(companyId) query=query.eq("company_id",companyId);
    const{data}=await query.single();
    if(data){
      setCo({name:data.name||"",zipcode:data.zipcode||"",address:data.address||"",tel:data.tel||"",invoiceNo:data.invoice_no||"",bankName:data.bank_name||"",bankBranch:data.bank_branch||"",bankType:data.bank_type||"普通",bankNo:data.bank_no||"",bankHolder:data.bank_holder||""});
      if(data.tax_rate)setTaxRate(data.tax_rate);
      setSetupDone(true);
    }
  }

  async function saveSettings(){
    const settings={name:co.name,zipcode:co.zipcode,address:co.address,tel:co.tel,invoice_no:co.invoiceNo,bank_name:co.bankName,bank_branch:co.bankBranch,bank_type:co.bankType,bank_no:co.bankNo,bank_holder:co.bankHolder,tax_rate:taxRate};
    if(companyId) settings.company_id=companyId;
    const{data:existing}=await sb.from("company_settings").select("id").limit(1).single();
    if(existing)await sb.from("company_settings").update(settings).eq("id",existing.id);
    else await sb.from("company_settings").insert(settings);
    alert("✅ 保存しました！");
  }

  async function logout(){await sb.auth.signOut();setDocs([]);setCompanyId(null);setSetupDone(false);goHome();}
  function goHome(){setTab("home");setSub(null);setForm(null);setSelected(null);}
  function startNew(){setForm({no:genNo(),createdAt:today(),dueDate:addDays(today(),30),flowStatus:"見積中",client:{name:"",address:"",person:"",tel:""},site:"",items:[emptyItem()],memo:""});setSub("new");setTab("home");}

  async function save(){
    if(!form.client.name||!form.site)return alert("取引先名と工事概要を入力してください");
    const docData={no:form.no,created_at:form.createdAt,due_date:form.dueDate,flow_status:form.flowStatus,data:JSON.stringify(form),user_id:user.id,company_id:companyId};
    const{data,error}=await sb.from("documents").insert(docData).select().single();
    if(error){alert("保存に失敗しました");return;}
    setDocs(p=>[{...form,id:data.id},...p]);
    goHome();
  }

  async function updateFlow(id,status){
    setDocs(p=>p.map(d=>d.id===id?{...d,flowStatus:status,flow_status:status}:d));
    if(selected?.id===id)setSelected(s=>({...s,flowStatus:status}));
    const doc=docs.find(d=>d.id===id);
    if(doc){const updated={...doc,flowStatus:status};await sb.from("documents").update({flow_status:status,data:JSON.stringify(updated)}).eq("id",id);}
  }

  async function deleteDoc(id){await sb.from("documents").delete().eq("id",id);setDocs(p=>p.filter(d=>d.id!==id));goHome();}

  const subTotal=form?calcSub(form.items):0;
  const txAmt=Math.floor(subTotal*TAX);
  const total=subTotal+txAmt;
  const summary={
    paid:docs.filter(d=>["入金済","完了"].includes(d.flowStatus)).reduce((s,d)=>{const b=calcSub(d.items);return s+b+Math.floor(b*TAX);},0),
    unpaid:docs.filter(d=>d.flowStatus==="請求済").reduce((s,d)=>{const b=calcSub(d.items);return s+b+Math.floor(b*TAX);},0),
    estimate:docs.filter(d=>["見積中","受注済"].includes(d.flowStatus)).reduce((s,d)=>{const b=calcSub(d.items);return s+b+Math.floor(b*TAX);},0),
    byStatus:Object.fromEntries(["見積中","受注済","請求済","入金済","完了","キャンセル"].map(s=>[s,docs.filter(d=>d.flowStatus===s).length])),
  };
  const filtered=filter==="ALL"?docs:docs.filter(d=>d.flowStatus===filter);

  if(authLoading)return<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#f3f4f6"}}><div style={{color:AC,fontFamily:"'Bebas Neue',sans-serif",fontSize:32,letterSpacing:"0.1em"}}>読み込み中...</div></div>;
  if(!user)return<LoginScreen/>;
  if(isAdmin&&companyId&&!setupDone&&!dbLoading)return<SetupScreen co={co} setCo={setCo} onComplete={()=>setSetupDone(true)}/>;
  if(showPrint&&printTarget)return<PrintView doc={printTarget} co={co} tax={TAX} onClose={()=>setShowPrint(false)}/>;

  const NAV=[
    {id:"home",label:"案件",svg:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>},
    {id:"summary",label:"集計",svg:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>},
    {id:"guide",label:"使い方",svg:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>},
    {id:"settings",label:"設定",svg:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>},
  ];

  return (
    <div style={{minHeight:"100vh",background:"#f3f4f6",paddingBottom:72}}>
      {/* ヘッダー */}
      <div className="np" style={{background:"#fff",borderBottom:"1px solid #e5e7eb",padding:"0 16px",display:"flex",alignItems:"center",justifyContent:"space-between",height:52,position:"sticky",top:0,zIndex:100,boxShadow:"0 1px 3px rgba(0,0,0,.06)"}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {sub&&<button onClick={goHome} style={{background:"none",border:"none",cursor:"pointer",fontSize:16,color:"#6b7280",padding:"0 4px 0 0"}}>←</button>}
          <span style={{fontSize:16}}>🏗</span>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:20,color:AC,letterSpacing:"0.1em"}}>KAITAI PRO</div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <span style={{fontSize:10,color:isAdmin?AC:"#3b82f6",background:isAdmin?"#fff7f0":"#eff6ff",border:`1px solid ${isAdmin?"#fbd5b5":"#bfdbfe"}`,padding:"2px 8px",borderRadius:999,fontWeight:700}}>{isAdmin?"管理者":"スタッフ"}</span>
          {!sub&&tab==="home"&&<button className="bp" style={{fontSize:12,padding:"7px 14px"}} onClick={startNew}>＋ 新規</button>}
          {sub==="new"&&<><button className="bg" onClick={goHome}>キャンセル</button><button className="bp" onClick={save}>保存</button></>}
          {sub==="detail"&&<button className="bp" style={{fontSize:12,padding:"7px 12px"}} onClick={()=>{setPrintTarget(selected);setShowPrint(true);}}>📄 PDF</button>}
          {!sub&&<button className="bg" style={{fontSize:11,padding:"5px 10px",color:"#9ca3af"}} onClick={logout}>ログアウト</button>}
        </div>
      </div>

      <div style={{maxWidth:680,margin:"0 auto",padding:"16px 14px"}}>

        {/* 案件一覧 */}
        {!sub&&tab==="home"&&(
          <div className="fade">
            {dbLoading&&<div style={{textAlign:"center",padding:20,color:"#9ca3af",fontSize:13}}>読み込み中...</div>}
            <div className="g4" style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:16}}>
              {[{l:"入金済",v:yen(summary.paid),c:"#16a34a",bg:"#f0fdf4"},{l:"未入金",v:yen(summary.unpaid),c:"#f59e0b",bg:"#fffbeb"},{l:"受注残",v:yen(summary.estimate),c:"#8b5cf6",bg:"#f5f3ff"}].map(s=>(
                <div key={s.l} className="card" style={{padding:"12px 14px",background:s.bg,border:`1px solid ${s.c}22`,borderRadius:0}}>
                  <div style={{fontSize:9,color:s.c,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:4,fontWeight:700}}>{s.l}</div>
                  <div style={{fontSize:"clamp(14px,3vw,18px)",fontWeight:900,color:s.c,fontFamily:"'Bebas Neue',sans-serif"}}>{s.v}</div>
                </div>
              ))}

              ):<div style={{padding:"9px 11px",background:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:6,fontSize:18,fontWeight:700}}>{taxRate}%</div>}
            </div>
            <div className="card" style={{padding:20,marginBottom:20}}>
              <div style={{fontWeight:700,fontSize:13,marginBottom:14,paddingBottom:10,borderBottom:"1px solid #f3f4f6"}}>🏦 振込先口座</div>
              {[{k:"bankName",l:"銀行名"},{k:"bankBranch",l:"支店名"},{k:"bankType",l:"口座種別"},{k:"bankNo",l:"口座番号"},{k:"bankHolder",l:"口座名義（カナ）"}].map(f=>(
                <div key={f.k} style={{marginBottom:12}}>
                  <label className="lbl">{f.l}</label>
                  {isAdmin?<input className="ifield" value={co[f.k]} onChange={e=>setCo(p=>({...p,[f.k]:e.target.value}))}/>:<div style={{padding:"9px 11px",background:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:6,fontSize:13}}>{co[f.k]}</div>}
                </div>
              ))}
            </div>
            {isAdmin&&<button className="bp" style={{width:"100%",fontSize:15,padding:"13px"}} onClick={saveSettings}>保存する</button>}
          </div>
        )}
      </div>

      {/* 下部ナビ */}
      {!sub&&(
        <div className="np" style={{position:"fixed",bottom:0,left:0,right:0,background:"#fff",borderTop:"1px solid #e5e7eb",display:"flex",height:64,zIndex:200,boxShadow:"0 -2px 8px rgba(0,0,0,.06)"}}>
          {NAV.map(n=>(
            <button key={n.id} onClick={()=>setTab(n.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:3,background:"none",border:"none",cursor:"pointer",color:tab===n.id?AC:"#9ca3af",padding:"8px 0",position:"relative"}}>
              {n.svg}
              <span style={{fontSize:10,fontWeight:tab===n.id?700:500}}>{n.label}</span>
              {tab===n.id&&<div style={{width:20,height:2,background:AC,borderRadius:1,position:"absolute",bottom:6}}/>}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
